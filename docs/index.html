            type="module"
        ></script>

    </head>
    <body class="bg color" style="--bg: var(--uk-bg); --color: var(--uk-bg-f)">
        <div class="flex justify-center p-2 items-center">
            <button
                id="themeBtn"
                class="uk-button uk-button-default"
                style="
                    --bg: var(--uk-secondary);
                    --color: var(--uk-secondary-f);
                    border: 1px solid var(--uk-border);
                "
            >
                <uk-icon
                    id="themeIcn"
                    class="size"
                    style="
                        --size: 4;
                        --bg: var(--uk-secondary);
                        --color: var(--uk-secondary-f);
                    "
                    icon="sun"
                ></uk-icon>
            </button>
        </div>

        <!-- franken JS -->
        <script>
            window.Lucide = {};
            window.ApexCharts = {};
        </script>
        <script
            src="https://cdn.jsdelivr.net/npm/frankenstyle@0.3.7/dist/js/hwc-icon.iife.js"
            type="module"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/frankenstyle@0.3.7/dist/js/hwc-components.iife.js"
            type="module"
        ></script>

        <!-- scripts -->

        <!-- Theme Toggle -->
        <script>
            const btn = document.getElementById("themeBtn");
            const icon = document.getElementById("themeIcn");

            let isLight = true;

            btn.addEventListener("click", () => {
                isLight = !isLight;

                icon.setAttribute("icon", isLight ? "sun" : "moon");

                document.documentElement.classList.toggle("dark", !isLight);
            });
        </script>
    </body>
</html>
